services:
  app:
    image: ghcr.io/astral-sh/uv:0.13.1-python3.14-trixie-slim
    working_dir: /app
    command: sh -c "uv sync --locked --no-dev && uv run --locked --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - venv:/opt/venv
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/companies')"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  venv:

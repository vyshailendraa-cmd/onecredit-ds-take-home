<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company summaries</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #1f2933; display: grid; grid-template-columns: 240px minmax(0, 1fr) minmax(480px, 1.2fr); height: 100vh; }
  aside, main, section { overflow-y: auto; padding: 16px; }
  aside { border-right: 1px solid #e4e7eb; }
  section { border-left: 1px solid #e4e7eb; background: #f8fafc; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; font: inherit; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.company { padding: 6px 8px; cursor: pointer; border-radius: 4px; }
  li.company:hover, li.company.active { background: #e6f0ff; }
  li.company small { display: block; color: #616e7c; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #616e7c; }
  nav { display: flex; gap: 16px; border-bottom: 1px solid #e4e7eb; margin: 16px 0; }
  nav button { background: none; border: 0; padding: 8px 0; font: inherit; cursor: pointer; color: #616e7c; }
  nav button.active { color: #1f2933; border-bottom: 2px solid #2563eb; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #e4e7eb; vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  h3 { font-size: 15px; margin: 16px 0 4px; }
  .summary { background: #fff; border: 1px solid #e4e7eb; border-radius: 6px; padding: 12px; min-width: 0; overflow-wrap: anywhere; }
  .side-by-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: start; }
  .side-by-side label { display: block; }
  .summary ul { list-style: disc; padding-left: 20px; }
  .summary ol { list-style: decimal; padding-left: 20px; }
  .version { margin: 0 0 8px; font-size: 12px; color: #616e7c; text-transform: uppercase; letter-spacing: 0.04em; }
  .warn { color: #b44d12; }
</style>
</head>
<body>
<aside>
  <input id="filter" placeholder="Filter companies">
  <ul id="companies"></ul>
</aside>
<main id="company"><p class="muted">Pick a company.</p></main>
<section>
  <h2 style="margin-top:0">Summary</h2>
  <div class="side-by-side">
    <label>Version <select id="versionA"></select></label>
    <label>Compare with <select id="versionB"></select></label>
  </div>
  <div id="summaries" class="side-by-side"></div>
</section>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => n == null ? "–" : (n < 0 ? "-" : "") + "RM " + Math.abs(n).toLocaleString("en-MY");
const num = (n) => n == null ? "–" : Number(n).toLocaleString("en-MY", { maximumFractionDigits: 4 });
const words = (key) => key.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
const table = (head, rows) => `<table><tr>${head.map((h, i) => `<th class="${i ? "num" : ""}">${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</table>`;
const rows = (pairs) => `<table>${pairs.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</table>`;

// Just enough Markdown for a summary: headings, lists, tables, bold, italics, paragraphs. HTML is escaped first.
function markdown(text) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  let html = "", list = null;
  const close = () => { if (list) { html += list === "table" ? "</tbody></table>" : `</${list}>`; list = null; } };
  const cells = (row) => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim()));
  for (const line of String(text).split("\n")) {
    let m;
    if (/^\s*\|.*\|\s*$/.test(line)) {
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; // the |---| row under a header
      if (list !== "table") { close(); html += `<table class="md"><thead><tr>${cells(line).map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>`; list = "table"; }
      else html += `<tr>${cells(line).map((c) => `<td>${c}</td>`).join("")}</tr>`;
    } else if ((m = line.match(/^(#{1,4})\s+(.*)/))) { close(); html += `<h${m[1].length + 2}>${inline(m[2])}</h${m[1].length + 2}>`; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      const kind = /^\s*\d/.test(line) ? "ol" : "ul";
      if (list !== kind) { close(); html += `<${kind}>`; list = kind; }
      html += `<li>${inline(m[1])}</li>`;
    } else if (line.trim()) { close(); html += `<p>${inline(line)}</p>`; }
    else close();
  }
  close();
  return html;
}

let current = null, tab = "overview";
const versions = {};

const tabs = {
  overview: (c) => {
    const p = c.profile, parents = c.relationships.shareholders.filter((s) => s.type === "company");
    return rows([["Registration number", esc(c.registrationNumber)], ["Status", esc(p.status)], ["Company type", esc(p.companyType)],
      ["Incorporated", esc(p.incorporationDate)], ["Industry", esc(p.industry)], ["State", esc(p.state)],
      ["Nature of business", esc(p.natureOfBusiness)], ["Share capital", money(p.shareCapital)]])
      + `<h3>Former names</h3>` + (p.formerNames.length ? table(["Name", "Changed on"], p.formerNames.map((f) => [esc(f.name), esc(f.changedOn)])) : `<p class="muted">None.</p>`)
      + `<h3>Corporate shareholders</h3>` + (parents.length ? table(["Company", "Registration number", "Incorporated in", "Share"], parents.map((s) => [esc(s.name), esc(s.registrationNumber ?? "–"), esc(s.incorporatedIn), num(s.percentage) + "%"])) : `<p class="muted">None.</p>`);
  },
  directors: (c) => `<h3>Directors</h3>` + table(["Name", "Designation", "Appointed on"], c.relationships.directors.map((d) => [esc(d.name), esc(d.designation), esc(d.appointedOn)]))
    + `<h3>Shareholders</h3>` + table(["Name", "Type", "Share"], c.relationships.shareholders.map((s) => [esc(s.name), esc(s.type), num(s.percentage) + "%"])),
  financials: (c) => {
    const years = c.financials.years;
    if (!years.length) return `<p class="muted">No financial statements filed.</p>`;
    const head = ["", ...years.map((y) => `FY${y.financialYear}`)];
    let html = rows([["Year ends", years.map((y) => esc(y.financialYearEnd)).join(", ")], ["Audit", years.map((y) => `FY${y.financialYear}: ${esc(y.audit.firm)}, ${esc(y.audit.opinion)}`).join("<br>")]]);
    html += `<h3>Statements</h3>` + table(head, Object.keys(years[0].statements).map((k) => [words(k), ...years.map((y) => money(y.statements[k]))]));
    for (const group of Object.keys(years[0].ratiosAndMetrics)) {
      html += `<h3>${words(group)}</h3>` + table(head, Object.keys(years[0].ratiosAndMetrics[group]).map((k) => [words(k), ...years.map((y) => num(y.ratiosAndMetrics[group][k]))]));
    }
    return html;
  },
  litigation: (c) => c.litigation.cases.length
    ? table(["Case", "Role", "Type", "Court", "Filed", "Status", "Claim"], c.litigation.cases.map((k) => [esc(k.caseNumber), esc(k.role), esc(k.caseType), esc(k.court), esc(k.filedOn), esc(k.status), money(k.claimAmount)]))
    : `<p class="muted">No court cases on record.</p>`,
};
const tabNames = { overview: "Overview & Relationships", directors: "Directors & Shareholders", financials: "Financials", litigation: "Litigation" };

function renderCompany() {
  if (!current) return;
  const p = current.profile;
  $("company").innerHTML = `<h1>${esc(p.companyName)}</h1><div class="muted">${esc(current.registrationNumber)} · ${esc(p.industry)} · ${esc(p.state)}</div>`
    + `<nav>${Object.entries(tabNames).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? "active" : ""}">${v}</button>`).join("")}</nav>`
    + tabs[tab](current);
  $("company").querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; renderCompany(); });
}

async function loadVersion(v) {
  if (v && !versions[v]) versions[v] = await (await fetch(`/api/summaries/${encodeURIComponent(v)}`)).json();
  return versions[v];
}

async function renderSummaries() {
  const out = [];
  for (const v of [$("versionA").value, $("versionB").value].filter(Boolean)) {
    const data = await loadVersion(v);
    const text = current && data.summaries[current.registrationNumber];
    const warn = data.invalidLines.length ? `<p class="warn">Couldn't read line(s) ${data.invalidLines.join(", ")} of summaries/${esc(v)}.jsonl.</p>` : "";
    out.push(`<div class="summary"><div class="version">${esc(v)}</div>${warn}${text ? markdown(text) : `<p class="muted">No summary for this company in this version.</p>`}</div>`);
  }
  $("summaries").innerHTML = out.join("") || `<p class="muted">No summaries yet. Write one line per company to <code>summaries/&lt;version&gt;.jsonl</code>, then refresh.</p>`;
}

async function selectCompany(reg) {
  current = await (await fetch(`/api/companies/${encodeURIComponent(reg)}`)).json();
  document.querySelectorAll("li.company").forEach((li) => li.classList.toggle("active", li.dataset.reg === reg));
  renderCompany();
  renderSummaries();
}

async function init() {
  const list = await (await fetch("/api/companies")).json();
  $("companies").innerHTML = list.map((c) => `<li class="company" data-reg="${esc(c.registrationNumber)}">${esc(c.companyName)}<small>${esc(c.registrationNumber)} · ${esc(c.industry)}</small></li>`).join("");
  $("companies").querySelectorAll("li").forEach((li) => li.onclick = () => selectCompany(li.dataset.reg));
  $("filter").oninput = (e) => $("companies").querySelectorAll("li").forEach((li) => li.hidden = !li.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
  const vs = await (await fetch("/api/summaries")).json();
  $("versionA").innerHTML = vs.map((v) => `<option>${esc(v)}</option>`).join("") || `<option value="">none yet</option>`;
  $("versionB").innerHTML = `<option value="">nothing</option>` + vs.map((v) => `<option>${esc(v)}</option>`).join("");
  $("versionA").onchange = $("versionB").onchange = renderSummaries;
  if (list.length) selectCompany(list[0].registrationNumber);
}
init();
</script>
</body>
</html>
